name: Build debug APK

# Runs automatically whenever you push to master, and can also be
# triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pin an exact, known-good version instead of always tracking
          # "stable" — a future Flutter release could reintroduce the
          # AGP 9 / new-DSL issue we just fixed. Bump this deliberately
          # when you're ready to test a newer Flutter.
          flutter-version: '3.44.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Create API keys file
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          weatherapi_key = os.environ.get("WEATHERAPI_KEY", "").strip()
          unsplash_key = os.environ.get("UNSPLASH_ACCESS_KEY", "").strip()

          if not weatherapi_key:
              raise SystemExit(
                  "Missing GitHub Actions secret WEATHERAPI_KEY. "
                  "A placeholder key builds successfully but makes WeatherAPI fail at runtime."
              )

          Path("lib/api_key.dart").write_text(
              f"const String wapi_Key = {json.dumps(weatherapi_key)};\n"
              f"const String access_key = {json.dumps(unsplash_key)};\n"
              'const String timezonedbKey = "";\n'
          )
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overmorrow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
