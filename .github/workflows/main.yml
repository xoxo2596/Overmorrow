name: Build debug APK

# Runs automatically whenever you push to master, and can also be
# triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pin an exact, known-good version instead of always tracking
          # "stable" — a future Flutter release could reintroduce the
          # AGP 9 / new-DSL issue we just fixed. Bump this deliberately
          # when you're ready to test a newer Flutter.
          flutter-version: '3.44.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder API keys file
        # lib/api_key.dart is intentionally gitignored (real keys shouldn't be
        # committed). The code references wapi_Key (capitalized, note this
        # doesn't match the lowercase name in api_key_example.dart), access_key,
        # and timezonedbKey. Dummy values are fine for a build check — the app
        # only needs a real weatherapi.com key if you actually select that
        # provider at runtime.
        run: |
          cat > lib/api_key.dart << 'EOF'
          const String wapi_Key = "placeholder";
          const String access_key = "placeholder";
          const String timezonedbKey = "placeholder";
          EOF

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: overmorrow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
